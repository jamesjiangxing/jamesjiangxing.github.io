<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .calculator {
    background: #1c1c1e;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    width: 320px;
  }
  .display {
    background: #000;
    color: #fff;
    font-size: 2.5rem;
    text-align: right;
    padding: 20px 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    min-height: 80px;
    word-wrap: break-word;
    word-break: break-all;
    overflow: hidden;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  button {
    border: none;
    border-radius: 50%;
    height: 65px;
    font-size: 1.4rem;
    cursor: pointer;
    transition: filter 0.15s;
    color: #fff;
    background: #333;
  }
  button:hover { filter: brightness(1.2); }
  button:active { filter: brightness(0.85); }
  .operator { background: #ff9500; }
  .function { background: #a5a5a5; color: #000; }
  .equals { background: #ff9500; }
  .zero { border-radius: 32px; grid-column: span 2; text-align: left; padding-left: 28px; }
</style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="function" onclick="clearAll()">AC</button>
      <button class="function" onclick="deleteLast()">⌫</button>
      <button class="function" onclick="appendValue('%')">%</button>
      <button class="operator" onclick="appendValue('/')">÷</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button class="zero" onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

<script>
  const display = document.getElementById('display');
  let current = '';

  function updateDisplay() {
    display.textContent = current === '' ? '0' : current;
  }

  function appendValue(val) {
    current += val;
    updateDisplay();
  }

  function clearAll() {
    current = '';
    updateDisplay();
  }

  function deleteLast() {
    current = current.slice(0, -1);
    updateDisplay();
  }

  function calculate() {
    try {
      let expr = current.replace(/%/g, '/100');
      let result = Function('"use strict"; return (' + expr + ')')();
      if (result === undefined || isNaN(result)) {
        current = 'Error';
      } else {
        current = String(Math.round(result * 1e10) / 1e10);
      }
    } catch (e) {
      current = 'Error';
    }
    updateDisplay();
  }

  // 键盘支持
  document.addEventListener('keydown', (e) => {
    const key = e.key;
    if (/[0-9+\-*/.%]/.test(key)) appendValue(key);
    else if (key === 'Enter' || key === '=') { e.preventDefault(); calculate(); }
    else if (key === 'Backspace') deleteLast();
    else if (key === 'Escape') clearAll();
  });
</script>
</body>
</html>
